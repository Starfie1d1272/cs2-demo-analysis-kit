[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs2dak"
version = "0.7.0"
description = "Desktop shell for cs2df v3 demo exports and DAK Studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xinyu Du" }]
dependencies = [
    "cs2df>=3.1.0",  # v3 reference exporter (polars/numpy-based)
    "typer>=0.12",   # CLI (version only)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
gui = ["pywebview>=5.0"]    # DAK Studio 桌面壳
build = ["pyinstaller>=6.0"] # bundle into a standalone .exe / .app

[project.scripts]
cs2dak = "cs2dak.cli:main"

[project.gui-scripts]
cs2dak-studio = "cs2dak.studio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2dak"]
artifacts = ["src/cs2dak/studio_web/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cs2dak"
version = "0.8.4"
description = "Desktop shell for cs2df v3 demo exports and DAK Studio"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Xinyu Du" }]
dependencies = [
    "cs2df>=3.1.0",  # v3 reference exporter (polars/numpy-based)
    "typer>=0.27.2",   # CLI (version only)
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]
gui = ["pywebview>=6.2.1"]    # DAK Studio 桌面壳
build = ["pyinstaller>=6.22.3"] # bundle into a standalone .exe / .app

[project.scripts]
cs2dak = "cs2dak.cli:main"

[project.gui-scripts]
cs2dak-studio = "cs2dak.studio:main"
rivalhub-demo-uploader = "cs2dak.rivalhub_uploader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2dak"]
artifacts = ["src/cs2dak/studio_web/**", "src/cs2dak/rivalhub_uploader_web/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

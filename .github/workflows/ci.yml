name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read


jobs:
  event-upload-worker:
    name: Event upload worker (typecheck · dry run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/event-upload-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/event-upload-worker"

  typescript:
    name: TypeScript (typecheck · fast tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:release-policy

      - run: pnpm check:package-boundaries

      - run: node --test scripts/legacy-update-first-hop.test.mjs

      - name: Cold serial build before typecheck and tests
        run: pnpm build:serial

      - run: pnpm typecheck

      - run: pnpm test:fast

      - run: pnpm build:serial

      - name: Smoke packed maps in a clean consumer
        run: node scripts/maps-package-smoke.mjs

      - name: Smoke all public tarballs and their transitive closure
        run: pnpm check:package-consumers

  typescript-integration:
    name: TypeScript (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter "@cs2dak/cli..." --filter "@cs2dak/react..." build

      - run: pnpm test:integration

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Tk for installer boundary tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - run: uv sync --frozen --extra dev --extra gui
        working-directory: python

      - name: Run pytest
        run: uv run pytest
        working-directory: python

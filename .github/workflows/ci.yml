name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read


jobs:
  typescript:
    name: TypeScript (typecheck · fast tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.7.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:release-policy

      - run: pnpm typecheck

      - run: pnpm test:fast

      - run: pnpm build

      - name: Smoke compiled tournament package
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @cs2dak/tournament exec node --input-type=module -e \
            "const m = await import('@cs2dak/tournament'); if (typeof m.buildTournamentAnalytics !== 'function' || typeof m.buildTournamentPerformanceAnalytics !== 'function') process.exit(1)"
          PACK_DIR="$RUNNER_TEMP/cs2dak-tournament-pack"
          mkdir -p "$PACK_DIR"
          pnpm --filter @cs2dak/tournament pack --pack-destination "$PACK_DIR"
          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          TARBALL_CONTENTS="$RUNNER_TEMP/cs2dak-tournament-pack-contents.txt"
          tar -tzf "$TARBALL" > "$TARBALL_CONTENTS"
          grep -Eq '(^|/)dist/index\.js$' "$TARBALL_CONTENTS"
          grep -Eq '(^|/)dist/index\.d\.ts$' "$TARBALL_CONTENTS"
          CONSUMER_DIR="$RUNNER_TEMP/cs2dak-tournament-consumer"
          mkdir -p "$CONSUMER_DIR"
          npm install --prefix "$CONSUMER_DIR" --no-save "$TARBALL"
          CONSUMER_DIR="$CONSUMER_DIR" node --input-type=module -e \
            "import { join } from 'node:path'; import { pathToFileURL } from 'node:url'; const root = join(process.env.CONSUMER_DIR, 'node_modules', '@cs2dak', 'tournament'); const m = await import(pathToFileURL(join(root, 'dist', 'index.js')).href); if (typeof m.buildTournamentAnalytics !== 'function' || typeof m.buildTournamentPerformanceAnalytics !== 'function') process.exit(1)"

  typescript-integration:
    name: TypeScript (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.7.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @cs2dak/tournament build

      - run: pnpm test:integration

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - run: uv sync --extra dev
        working-directory: python

      - name: Run pytest
        run: uv run pytest
        working-directory: python

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read


jobs:
  typescript:
    name: TypeScript (typecheck · fast tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:release-policy

      - run: pnpm check:package-boundaries

      - run: node --test scripts/uploader-release-contract.test.mjs

      - run: node --test scripts/sync-version.test.mjs scripts/build-info.test.mjs scripts/build-web-patch.test.mjs

      - name: Build shared artifacts before cold typecheck and tests
        run: pnpm build:packages

      - run: pnpm typecheck

      - run: pnpm test:fast

      - run: pnpm build

      - name: Smoke packed maps in a clean consumer
        run: node scripts/maps-package-smoke.mjs

      - name: Smoke all public tarballs and their transitive closure
        run: pnpm check:package-consumers

  typescript-integration:
    name: TypeScript (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter "@cs2dak/cli..." --filter "@cs2dak/react..." build

      - run: pnpm test:integration

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Tk for installer boundary tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - run: uv sync --frozen --extra dev --extra gui
        working-directory: python

      - name: Run pytest
        run: uv run pytest
        working-directory: python

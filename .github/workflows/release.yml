name: Release

# 打 vX.Y.Z tag 自动构建桌面应用（unsigned）并发布到 GitHub Release：
#   macOS  → DAK Studio DMG + rivalhub-demo-uploader-X.Y.Z.dmg
#   Windows→ DAK Studio ZIP + rivalhub-demo-uploader-windows-X.Y.Z.zip
# Uploader 单独发布，不进入 DAK Studio 更新包或安装器。
# 首次打开需绕过 Gatekeeper / SmartScreen，见 Release 描述。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 vX.Y.Z tag（仅用于失败后的安全重试）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows Defender 实时扫描会逐个扫 PyInstaller/pnpm 写出的成千上万个小文件。
      # 排除 workspace 与 temp 目录显著提速。
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # sync-version.mjs 需要 git tag

      - name: Validate immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an existing vX.Y.Z tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: Build desktop packages
        env:
          PACKAGE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: PACKAGE_SKIP_VERSION_SYNC=1 bash scripts/package.sh
        shell: bash

      # .tri 由独立资产发布路径维护，不随桌面应用 release 重新生成或上传。安装
      # 包与 updater 都从已发布的 R2 manifest 按需获取；缺失只会降级相关分析。
      - name: Fetch published tris manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://dakupdate.starfie1d.top/tris/manifest.json" \
            -o tris-manifest.json
          node -e 'const manifest = require("./tris-manifest.json"); if (!manifest.maps || Object.keys(manifest.maps).length === 0) throw new Error("published tris manifest is empty");'

      - name: Build standalone RivalHub Demo Uploader
        run: bash scripts/package-uploader.sh
        shell: bash

      - name: Decide in-app update kind
        id: update_kind
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)"
          KIND="$(node scripts/decide-update-kind.mjs "$BASE" HEAD | tail -n1)"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "In-app update kind: $KIND (base: $BASE)"

      - name: Zip Windows onedir app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd python/dist
          7z a -mx=9 "dak-studio-windows-${VERSION}.zip" dak-studio
          cd ../..
          uv run --project python python scripts/check-desktop-notices.py "python/dist/dak-studio-windows-${VERSION}.zip" studio

      - name: Build web patch
        if: runner.os == 'Windows' && steps.update_kind.outputs.kind == 'web'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Use the frontend already embedded in this release's desktop runtime.
          # Environment exports from package.sh do not survive between CI steps.
          node scripts/build-web-patch.mjs "$VERSION" python/dist python/dist/dak-studio/_internal/studio_web

      # 0.7.0: Web Installer（极简 tkinter，onefile ~15MB）
      - name: Build Web Installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd python
          uv sync --extra gui --extra build
          uv run pyinstaller packaging/installer.spec --noconfirm --distpath dist
          cd ..
          VERSION="$(node -p "require('./package.json').version")"
          mv python/dist/DAK-Studio-Setup.exe "python/dist/DAK-Studio-Setup-${VERSION}.exe"

      # 0.7.0: 准备 event packages（从 R2 取已发布成品）。
      # 仅用于 gen-install-manifest（计算 sha256/size）和 assemble-full-zip（打包进 full zip）。
      # 上传到 R2 由 pnpm events:publish 单独完成，与 app 发版周期解耦。
      - name: Prepare event packages
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/events
          for slug in iem-cologne-major-2026-stage3 iem-cologne-major-2026-playoff; do
            mkdir -p "dist/events/${slug}"
            curl -fL "https://dakupdate.starfie1d.top/events/${slug}/${slug}.zip" \
              -o "dist/events/${slug}/${slug}.zip"
            echo "event: ${slug}"
          done

      # 0.7.0: 生成 install-manifest.json
      - name: Generate install manifest
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/gen-install-manifest.mjs \
            --version "$VERSION" \
            --runtime-zip "python/dist/dak-studio-windows-${VERSION}.zip" \
            --event-packages dist/events/ \
            --tris-manifest tris-manifest.json \
            --channel stable \
            --asset-set cologne-major-2026-full \
            --out python/dist/install-manifest.json

      # 0.7.0: 组装 Full Portable Zip
      - name: Assemble full portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/assemble-full-zip.mjs \
            --runtime-zip "python/dist/dak-studio-windows-${VERSION}.zip" \
            --bundled-events dist/events/ \
            --tris-manifest tris-manifest.json \
            --tris-dir "$HOME/.awpy/tris" \
            --install-manifest python/dist/install-manifest.json \
            --out python/dist/
          uv run --project python python scripts/check-desktop-notices.py "python/dist/dak-studio-windows-${VERSION}-full.zip" studio

      # 自动更新 manifest：客户端从 releases/latest/download/latest.json 拉取（带镜像）。
      # 只在 Windows job 产出（桌面端只面向 Windows）。
      - name: Generate update manifest (with changelog notes)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # 提取 CHANGELOG.md 中本版本的更新说明，注入 manifest notes
          awk -v ver="$VERSION" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog-notes.txt
          if ! grep -q '[^[:space:]]' /tmp/changelog-notes.txt; then
            echo "::error::CHANGELOG.md is missing non-empty notes for v${VERSION}"
            exit 1
          fi
          WEB_ARGS=()
          if [ -f "python/dist/dak-studio-web-${VERSION}.zip" ]; then
            WEB_ARGS=(--web-zip "python/dist/dak-studio-web-${VERSION}.zip")
          fi
          node scripts/gen-update-manifest.mjs "$VERSION" \
            "python/dist/dak-studio-windows-${VERSION}.zip" \
            "python/dist/latest-v2.json" \
            --legacy-out "python/dist/latest.json" \
            --installer "python/dist/DAK-Studio-Setup-${VERSION}.exe" \
            --notes-file /tmp/changelog-notes.txt \
            "${WEB_ARGS[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          compression-level: 0
          path: |
            python/dist/*.dmg
            python/dist/*.zip
            python/dist/DAK-Studio-Setup*.exe
            python/dist/RivalHub-Demo-Uploader-Setup*.exe
            python/dist/install-manifest.json
            python/dist/latest.json
            python/dist/latest-v2.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Extract the section between "## [VERSION]" and the next "## [" or EOF
          SECTION=$(awk -v ver="$VERSION" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md)
          if ! printf '%s\n' "$SECTION" | grep -q '[^[:space:]]'; then
            echo "::error::CHANGELOG.md is missing non-empty notes for v${VERSION}"
            exit 1
          fi
          # Write to env file for the next step
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SECTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Uploader 不进入 Studio updater，但需要稳定的公开分发元数据供官网消费。
      # 内联生成可保证手动重跑既有 tag 时，不依赖 tag 内后来新增的脚本。
      - name: Generate uploader distribution manifest
        env:
          OWNER_REPO: Starfie1d1272/cs2-demo-analysis-kit
          R2_PUBLIC_BASE: https://dakupdate.starfie1d.top
        run: |
          set -euo pipefail
          export VERSION="${RELEASE_TAG#v}"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const path = require("path");
          const version = process.env.VERSION;
          const repo = process.env.OWNER_REPO;
          const r2Base = process.env.R2_PUBLIC_BASE;
          const tag = `v${version}`;
          const proxies = ["", "https://ghfast.top/", "https://gh-proxy.com/", "https://ghproxy.net/"];
          function asset(file) {
            if (!fs.existsSync(file)) throw new Error(`missing uploader asset: ${file}`);
            const buf = fs.readFileSync(file);
            const name = path.basename(file);
            const raw = `https://github.com/${repo}/releases/download/${tag}/${name}`;
            return {
              name,
              size: buf.length,
              sha256: crypto.createHash("sha256").update(buf).digest("hex"),
              urls: [`${r2Base}/releases/${tag}/${name}`, ...proxies.map((p) => p ? `${p}${raw}` : raw)],
            };
          }
          const manifest = {
            schemaVersion: "cs2-demo-analysis-kit/uploader-distribution-1",
            version,
            publishedAt: new Date().toISOString(),
            assets: {
              windows: asset(`dist/rivalhub-demo-uploader-windows-${version}.zip`),
              windowsInstaller: asset(`dist/RivalHub-Demo-Uploader-Setup-${version}.exe`),
              macos: asset(`dist/rivalhub-demo-uploader-${version}.dmg`),
            },
          };
          fs.writeFileSync("dist/uploader-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("uploader distribution manifest ready");
          NODE

      # 自建 R2 镜像（国内可达，最高优先级）。上传 Studio runtime/installer/full zip、
      # Uploader 双平台产物及各自 manifest 到与公开 URL 一致的路径。
      # GitHub Release 仍是权威源/兜底；ghproxy 为最后兜底。
      - name: Upload to R2 mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TAG="v${VERSION}"
          ZIP="dist/dak-studio-windows-${VERSION}.zip"
          WEB_ZIP="dist/dak-studio-web-${VERSION}.zip"
          INSTALLER="dist/DAK-Studio-Setup-${VERSION}.exe"
          FULL_ZIP="dist/dak-studio-windows-${VERSION}-full.zip"
          INSTALL_MANIFEST="dist/install-manifest.json"
          UPLOADER_WIN="dist/rivalhub-demo-uploader-windows-${VERSION}.zip"
          UPLOADER_MAC="dist/rivalhub-demo-uploader-${VERSION}.dmg"
          UPLOADER_SETUP="dist/RivalHub-Demo-Uploader-Setup-${VERSION}.exe"
          UPLOADER_MANIFEST="dist/uploader-manifest.json"

          if [ ! -f "$ZIP" ]; then
            echo "::error::缺少 $ZIP，跳过 R2 上传"
            exit 1
          fi

          # 1. Core runtime zip（不可变）
          aws s3 cp "$ZIP" \
            "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-windows-${VERSION}.zip" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/zip \
            --cache-control "public, max-age=31536000, immutable"
          echo "R2: runtime zip ✓"

          # 1b. Frontend-only web patch（可选；应用内更新优先用它）
          if [ -f "$WEB_ZIP" ]; then
            aws s3 cp "$WEB_ZIP" \
              "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-web-${VERSION}.zip" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/zip \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: web patch ✓"
          fi

          # 2. Web Installer exe（不可变）
          if [ -f "$INSTALLER" ]; then
            aws s3 cp "$INSTALLER" \
              "s3://${R2_BUCKET}/releases/${TAG}/DAK-Studio-Setup-${VERSION}.exe" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/vnd.microsoft.portable-executable \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: installer ✓"
          fi

          # 3. Full portable zip（不可变）
          if [ -f "$FULL_ZIP" ]; then
            aws s3 cp "$FULL_ZIP" \
              "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-windows-${VERSION}-full.zip" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/zip \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: full zip ✓"
          fi

          # 4. Versioned install input; stable promotion waits for public download verification.
          if [ -f "$INSTALL_MANIFEST" ]; then
            aws s3 cp "$INSTALL_MANIFEST" \
              "s3://${R2_BUCKET}/releases/${TAG}/install-manifest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: install-manifest snapshot ✓ (${TAG}/)"
          fi

          # 5. Verify versioned snapshots before announcing through stable pointers.
          aws s3 cp "dist/latest-v2.json" \
            "s3://${R2_BUCKET}/releases/${TAG}/latest-v2.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"
          aws s3 cp "dist/latest.json" \
            "s3://${R2_BUCKET}/releases/${TAG}/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"
          echo "R2: latest.json ✓"

          # 6. RivalHub Demo Uploader 双平台产物（不可变）
          for uploader in "$UPLOADER_WIN" "$UPLOADER_MAC" "$UPLOADER_SETUP"; do
            if [ ! -f "$uploader" ]; then
              echo "::error::缺少 $uploader"
              exit 1
            fi
          done
          aws s3 cp "$UPLOADER_WIN" \
            "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-windows-${VERSION}.zip" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/zip \
            --content-disposition "attachment; filename=rivalhub-demo-uploader-windows-${VERSION}.zip" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "$UPLOADER_MAC" \
            "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-${VERSION}.dmg" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/x-apple-diskimage \
            --content-disposition "attachment; filename=rivalhub-demo-uploader-${VERSION}.dmg" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "$UPLOADER_SETUP" "s3://${R2_BUCKET}/releases/${TAG}/$(basename "$UPLOADER_SETUP")" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/vnd.microsoft.portable-executable \
            --cache-control "public, max-age=31536000, immutable"
          echo "R2: uploader binaries ✓"

          # 7. Uploader manifest：版本化快照 + 稳定 latest 入口
          if [ ! -f "$UPLOADER_MANIFEST" ]; then
            echo "::error::缺少 $UPLOADER_MANIFEST"
            exit 1
          fi
          aws s3 cp "$UPLOADER_MANIFEST" \
            "s3://${R2_BUCKET}/releases/${TAG}/uploader-manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
          echo "R2: uploader manifest snapshot ✓ (${TAG}/)"

          echo "R2 上传完成"

      - name: Verify R2 release manifests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          export VERSION="${RELEASE_TAG#v}"
          TAG="v${VERSION}"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/latest.json" latest.json --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/latest-v2.json" latest-v2.json --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/install-manifest.json" install-manifest.json --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/uploader-manifest.json" uploader-manifest.json --endpoint-url "$R2_ENDPOINT"
          node - <<'NODE'
          const fs = require("fs");
          const latest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
          const compatible = JSON.parse(fs.readFileSync("latest-v2.json", "utf8"));
          const install = JSON.parse(fs.readFileSync("install-manifest.json", "utf8"));
          const uploader = JSON.parse(fs.readFileSync("uploader-manifest.json", "utf8"));
          const version = process.env.VERSION;
          if (latest.version !== version) throw new Error(`latest.json version ${latest.version} != ${version}`);
          if (compatible.version !== version || compatible.schemaVersion !== "cs2-demo-analysis-kit/update-2") throw new Error("compatible update manifest version/schema mismatch");
          if (latest.updateMode !== "manual-install" || Object.keys(latest.assets ?? {}).length || !latest.notes?.includes("手动下载")) throw new Error("legacy updater must receive manual-install guidance without apply assets");
          if (install.appVersion !== version) throw new Error(`install appVersion ${install.appVersion} != ${version}`);
          if (uploader.version !== version) throw new Error(`uploader version ${uploader.version} != ${version}`);
          if (uploader.schemaVersion !== "cs2-demo-analysis-kit/uploader-distribution-1") throw new Error("unexpected uploader manifest schema");
          for (const [label, asset] of Object.entries({
            runtime: compatible.assets.windows,
            legacyInstaller: latest.manualInstall,
            installRuntime: install.runtime,
            uploaderWindows: uploader.assets.windows,
            uploaderMacos: uploader.assets.macos,
            uploaderInstaller: uploader.assets.windowsInstaller,
          })) {
            if (!asset?.urls?.[0]?.startsWith("https://dakupdate.starfie1d.top/")) throw new Error(`${label} first URL is not R2`);
            if (!asset.sha256 || !asset.size) throw new Error(`${label} missing sha256/size`);
          }
          console.log("manifest metadata OK");
          NODE
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-windows-${VERSION}.zip" dak-runtime.zip --endpoint-url "$R2_ENDPOINT"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const asset = require("./latest-v2.json").assets.windows;
          const buf = fs.readFileSync("dak-runtime.zip");
          const sha = crypto.createHash("sha256").update(buf).digest("hex");
          if (buf.length !== asset.size) throw new Error(`runtime size ${buf.length} != ${asset.size}`);
          if (sha !== asset.sha256) throw new Error(`runtime sha256 ${sha} != ${asset.sha256}`);
          console.log("R2 runtime OK", buf.length);
          NODE

          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/DAK-Studio-Setup-${VERSION}.exe" studio-setup.exe --endpoint-url "$R2_ENDPOINT"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const asset = require("./latest.json").manualInstall;
          const buf = fs.readFileSync("studio-setup.exe");
          if (buf.length !== asset.size || crypto.createHash("sha256").update(buf).digest("hex") !== asset.sha256) throw new Error("legacy installer size/SHA-256 mismatch");
          console.log("R2 safe manual installer OK", buf.length);
          NODE

          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-windows-${VERSION}.zip" uploader-windows.zip --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-${VERSION}.dmg" uploader-macos.dmg --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/RivalHub-Demo-Uploader-Setup-${VERSION}.exe" uploader-setup.exe --endpoint-url "$R2_ENDPOINT"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const manifest = require("./uploader-manifest.json");
          const files = [["windows", "uploader-windows.zip"], ["macos", "uploader-macos.dmg"], ["windowsInstaller", "uploader-setup.exe"]];
          for (const [key, file] of files) {
            const asset = manifest.assets[key];
            const buf = fs.readFileSync(file);
            const sha = crypto.createHash("sha256").update(buf).digest("hex");
            if (buf.length !== asset.size) throw new Error(`${key} size ${buf.length} != ${asset.size}`);
            if (sha !== asset.sha256) throw new Error(`${key} sha256 ${sha} != ${asset.sha256}`);
            console.log(`R2 uploader ${key} OK`, buf.length);
          }
          NODE

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/DAK-Studio-Setup*.exe
            dist/RivalHub-Demo-Uploader-Setup*.exe
            dist/install-manifest.json
            dist/latest.json
            dist/latest-v2.json
            dist/uploader-manifest.json
          body: |
            **安装说明**

            ### 已安装用户（推荐：应用内更新）
            0.8.5 及更早版本：左下角「检查更新」会提示手动下载。本次首次升级请先关闭
            Studio，运行本 Release 的 `DAK-Studio-Setup-<version>.exe` 并选择原安装目录。
            安装器保留 `userdata`（SQLite / Demo ZIP）、`assets`、`cache`、`updates`；
            不要删除旧目录。旧嵌套安装含资料时会停止并提供恢复指引。
            完成这次安全安装后，新运行时继续支持自动更新，迁移失败会保留新旧目录和日志。

            ### Windows（推荐：Web Installer）
            下载 `DAK-Studio-Setup-<version>.exe`，运行后选择安装目录，联网自动下载运行时 +
            内置赛事 + 地图数据。安装完成后首次启动即完整体验。

            ### Windows（离线：Full Portable Zip）
            下载 `dak-studio-windows-<version>-full.zip`，解压即用。
            已预装 Cologne Major 2026 完整赛事包 + 全部地图数据。

            ### Windows（开发者：Core Zip）
            下载 `dak-studio-windows-<version>.zip`，仅运行时，不含大赛事和地图数据。
            主要用于排查或手动覆盖安装；普通用户优先使用 Web Installer 或应用内更新。

            ### RivalHub Demo Uploader
            Windows 推荐 `RivalHub-Demo-Uploader-Setup-<version>.exe`：包含完整应用，可选择安装
            目录，安装后通过快捷方式启动。已有安装请在原目录升级/修复，卸载保留用户资料。
            ZIP 兜底为 `rivalhub-demo-uploader-windows-<version>.zip`，请完整解压并保留目录结构，
            勿单独拖出 EXE。macOS 使用 `rivalhub-demo-uploader-<version>.dmg`。
            程序首次连接时会打开浏览器完成 RivalHub 授权。
            上传异常会显示错误编号和处理建议，可从窗口导出诊断日志。

            ### macOS · DAK Studio
            1. 打开 DMG，把 **DAK Studio** 拖到右侧的 **Applications** 文件夹。
            2. 推出 DMG（桌面上右键 → 推出"DAK Studio"）。
            3. 从 **启动台** 或 `/Applications/DAK Studio.app` 打开。
            4. macOS 会提示「无法验证开发者」→ **系统设置 → 隐私与安全性 → 拉到底点「仍要打开」**。
               （不要直接从 DMG 挂载卷双击——Gatekeeper 会静默拒绝，没有任何提示。）

            终端一键解除隔离（替代步骤 4）：
            ```bash
            xattr -dr com.apple.quarantine "/Applications/DAK Studio.app"
            ```

            老版本 Win10 如启动后白屏，需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)。

            ---

            ${{ steps.changelog.outputs.changelog }}

      - name: Verify installer downloads then announce Studio update
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          LATEST_TAG="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          if [ "$LATEST_TAG" != "$TAG" ]; then
            echo "::error::Legacy manual download destination is not this release"
            exit 1
          fi
          LATEST_PAGE="$(curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output /dev/null --write-out '%{url_effective}' "https://github.com/${{ github.repository }}/releases/latest")"
          if [[ "$LATEST_PAGE" != "https://github.com/${{ github.repository }}/releases/tag/${TAG}" ]]; then
            echo "::error::Actual legacy download page has not reached this release"
            exit 1
          fi
          curl --fail --location --retry 5 --retry-all-errors \
            "https://dakupdate.starfie1d.top/releases/${TAG}/DAK-Studio-Setup-${VERSION}.exe" -o public-r2-setup.exe
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/DAK-Studio-Setup-${VERSION}.exe" -o public-github-setup.exe
          curl --fail --location --retry 5 --retry-all-errors \
            "https://dakupdate.starfie1d.top/releases/${TAG}/install-manifest.json" -o public-r2-install.json
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/install-manifest.json" -o public-github-install.json
          node - <<'NODE'
          const fs = require("fs"), crypto = require("crypto");
          const expected = require("./dist/latest.json").manualInstall;
          for (const file of ["public-r2-setup.exe", "public-github-setup.exe"]) {
            const bytes = fs.readFileSync(file);
            if (bytes.length !== expected.size || crypto.createHash("sha256").update(bytes).digest("hex") !== expected.sha256) throw new Error("public manual installer size/SHA-256 mismatch");
          }
          const install = fs.readFileSync("dist/install-manifest.json");
          for (const file of ["public-r2-install.json", "public-github-install.json"]) {
            if (!fs.readFileSync(file).equals(install)) throw new Error("public versioned install input differs from the verified release");
          }
          console.log("Old-client manual destination and both public installer downloads verified");
          NODE
          for name in install-manifest.json latest-v2.json; do
            aws s3 cp "dist/$name" "s3://${R2_BUCKET}/releases/$name" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "public, max-age=300"
            aws s3 cp "s3://${R2_BUCKET}/releases/$name" "published-$name" --endpoint-url "$R2_ENDPOINT"
            cmp "dist/$name" "published-$name"
          done
          aws s3 cp dist/uploader-manifest.json "s3://${R2_BUCKET}/releases/uploader/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "public, max-age=300"
          aws s3 cp "s3://${R2_BUCKET}/releases/uploader/latest.json" published-uploader.json --endpoint-url "$R2_ENDPOINT"
          cmp dist/uploader-manifest.json published-uploader.json
          # Legacy announcement is last: the page, exact installer and install input are ready.
          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/releases/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "public, max-age=300"
          aws s3 cp "s3://${R2_BUCKET}/releases/latest.json" published-latest.json --endpoint-url "$R2_ENDPOINT"
          cmp dist/latest.json published-latest.json

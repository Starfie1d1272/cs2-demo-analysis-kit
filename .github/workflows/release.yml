name: Release

# 打 vX.Y.Z tag 自动构建桌面应用（unsigned）并发布到 GitHub Release：
#   macOS  → dak-studio-X.Y.Z.dmg
#   Windows→ dak-studio-windows-X.Y.Z.zip（onedir）
# 只发 DAK Studio（自带 exporter bridge）；纯导出器 cs2dak 不进 Release。
# 首次打开需绕过 Gatekeeper / SmartScreen，见 Release 描述。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows Defender 实时扫描会逐个扫 PyInstaller/pnpm 写出的成千上万个小文件。
      # 排除 workspace 与 temp 目录显著提速。
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # sync-version.mjs 需要 git tag

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      # .tri 碰撞几何（~30MB/图，不进 git）：runner 上现场下载到 ~/.awpy/tris。
      # 0.6.4 起**不再内置**进安装包，而是上传到 R2，客户端首次用到某图时按需下载
      # 到 userdata/tris overlay（缺失只降级：反应时间/预瞄退化口径）。
      - name: Cache awpy tris
        uses: actions/cache@v6
        with:
          path: ~/.awpy/tris
          key: awpy-tris-${{ runner.os }}-v1

      - name: Download awpy tris
        shell: bash
        run: |
          if compgen -G "$HOME/.awpy/tris/*.tri" > /dev/null; then
            echo "awpy tris cache hit; skipping download"
          else
            uvx awpy get tris
          fi

      # .tri 资产外置：生成 tris-manifest 并把 .tri + 清单同步到 R2。只在 Windows
      # job 跑一次（.tri 与平台无关）。aws s3 sync --size-only 保证未变更的 .tri
      # 不重复上传——仅 awpy 更新时才真正再传 ~200MB；平时近乎零成本。
      - name: Upload .tri assets to R2
        if: runner.os == 'Windows'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          node scripts/gen-tris-manifest.mjs "$HOME/.awpy/tris" tris-manifest.json
          # 各 .tri：不可变长缓存；--size-only 跳过已存在且大小相同的
          aws s3 sync "$HOME/.awpy/tris" "s3://${R2_BUCKET}/tris/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.tri" \
            --size-only \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"
          # 清单：短缓存（max-age=300），客户端尽快看到资产变化
          aws s3 cp tris-manifest.json "s3://${R2_BUCKET}/tris/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"
          echo "R2 .tri 同步完成：${R2_BUCKET}/tris/"

      - name: Build desktop packages
        run: PACKAGE_SKIP_VERSION_SYNC=1 bash scripts/package.sh
        shell: bash

      - name: Decide in-app update kind
        id: update_kind
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)"
          KIND="$(node scripts/decide-update-kind.mjs "$BASE" HEAD | tail -n1)"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "In-app update kind: $KIND (base: $BASE)"

      - name: Zip Windows onedir app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd python/dist
          7z a -mx=9 "dak-studio-windows-${VERSION}.zip" dak-studio

      - name: Build web patch
        if: runner.os == 'Windows' && steps.update_kind.outputs.kind == 'web'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/build-web-patch.mjs "$VERSION" python/dist

      # 0.7.0: Web Installer（极简 tkinter，onefile ~15MB）
      - name: Build Web Installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd python
          uv sync --extra gui --extra build
          uv run pyinstaller packaging/installer.spec --noconfirm --distpath dist
          cd ..
          VERSION="$(node -p "require('./package.json').version")"
          mv python/dist/DAK-Studio-Setup.exe "python/dist/DAK-Studio-Setup-${VERSION}.exe"

      # 0.7.0: 准备 event packages（从 R2 取已发布成品）。
      # 仅用于 gen-install-manifest（计算 sha256/size）和 assemble-full-zip（打包进 full zip）。
      # 上传到 R2 由 pnpm events:publish 单独完成，与 app 发版周期解耦。
      - name: Prepare event packages
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/events
          for slug in iem-cologne-major-2026-stage3 iem-cologne-major-2026-playoff; do
            mkdir -p "dist/events/${slug}"
            curl -fL "https://dakupdate.starfie1d.top/events/${slug}/${slug}.zip" \
              -o "dist/events/${slug}/${slug}.zip"
            echo "event: ${slug}"
          done

      # 0.7.0: 生成 install-manifest.json
      - name: Generate install manifest
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/gen-install-manifest.mjs \
            --version "$VERSION" \
            --runtime-zip "python/dist/dak-studio-windows-${VERSION}.zip" \
            --event-packages dist/events/ \
            --tris-manifest tris-manifest.json \
            --channel stable \
            --asset-set cologne-major-2026-full \
            --out python/dist/install-manifest.json

      # 0.7.0: 组装 Full Portable Zip
      - name: Assemble full portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/assemble-full-zip.mjs \
            --runtime-zip "python/dist/dak-studio-windows-${VERSION}.zip" \
            --bundled-events dist/events/ \
            --tris-manifest tris-manifest.json \
            --tris-dir "$HOME/.awpy/tris" \
            --install-manifest python/dist/install-manifest.json \
            --out python/dist/

      # 自动更新 manifest：客户端从 releases/latest/download/latest.json 拉取（带镜像）。
      # 只在 Windows job 产出（桌面端只面向 Windows）。
      - name: Generate update manifest (with changelog notes)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # 提取 CHANGELOG.md 中本版本的更新说明，注入 manifest notes
          awk -v ver="$VERSION" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog-notes.txt
          if ! grep -q '[^[:space:]]' /tmp/changelog-notes.txt; then
            echo "::error::CHANGELOG.md is missing non-empty notes for v${VERSION}"
            exit 1
          fi
          WEB_ARGS=()
          if [ -f "python/dist/dak-studio-web-${VERSION}.zip" ]; then
            WEB_ARGS=(--web-zip "python/dist/dak-studio-web-${VERSION}.zip")
          fi
          node scripts/gen-update-manifest.mjs "$VERSION" \
            "python/dist/dak-studio-windows-${VERSION}.zip" \
            "python/dist/latest.json" \
            --notes-file /tmp/changelog-notes.txt \
            "${WEB_ARGS[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          compression-level: 0
          path: |
            python/dist/*.dmg
            python/dist/*.zip
            python/dist/DAK-Studio-Setup*.exe
            python/dist/install-manifest.json
            python/dist/latest.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract the section between "## [VERSION]" and the next "## [" or EOF
          SECTION=$(awk -v ver="$VERSION" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md)
          if ! printf '%s\n' "$SECTION" | grep -q '[^[:space:]]'; then
            echo "::error::CHANGELOG.md is missing non-empty notes for v${VERSION}"
            exit 1
          fi
          # Write to env file for the next step
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SECTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 自建 R2 镜像（国内可达，最高优先级）。上传 runtime zip、installer、full zip、
      # install-manifest.json、event packages 到与代码中 URL 一致的路径。
      # GitHub Release 仍是权威源/兜底；ghproxy 为最后兜底。
      - name: Upload to R2 mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="v${VERSION}"
          ZIP="dist/dak-studio-windows-${VERSION}.zip"
          WEB_ZIP="dist/dak-studio-web-${VERSION}.zip"
          INSTALLER="dist/DAK-Studio-Setup-${VERSION}.exe"
          FULL_ZIP="dist/dak-studio-windows-${VERSION}-full.zip"
          INSTALL_MANIFEST="dist/install-manifest.json"

          if [ ! -f "$ZIP" ]; then
            echo "::error::缺少 $ZIP，跳过 R2 上传"
            exit 1
          fi

          # 1. Core runtime zip（不可变）
          aws s3 cp "$ZIP" \
            "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-windows-${VERSION}.zip" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/zip \
            --cache-control "public, max-age=31536000, immutable"
          echo "R2: runtime zip ✓"

          # 1b. Frontend-only web patch（可选；应用内更新优先用它）
          if [ -f "$WEB_ZIP" ]; then
            aws s3 cp "$WEB_ZIP" \
              "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-web-${VERSION}.zip" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/zip \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: web patch ✓"
          fi

          # 2. Web Installer exe（不可变）
          if [ -f "$INSTALLER" ]; then
            aws s3 cp "$INSTALLER" \
              "s3://${R2_BUCKET}/releases/${TAG}/DAK-Studio-Setup-${VERSION}.exe" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/vnd.microsoft.portable-executable \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: installer ✓"
          fi

          # 3. Full portable zip（不可变）
          if [ -f "$FULL_ZIP" ]; then
            aws s3 cp "$FULL_ZIP" \
              "s3://${R2_BUCKET}/releases/${TAG}/dak-studio-windows-${VERSION}-full.zip" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/zip \
              --cache-control "public, max-age=31536000, immutable"
            echo "R2: full zip ✓"
          fi

          # 4. install-manifest.json（versioned + latest 双路径）
          if [ -f "$INSTALL_MANIFEST" ]; then
            aws s3 cp "$INSTALL_MANIFEST" \
              "s3://${R2_BUCKET}/releases/${TAG}/install-manifest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 cp "$INSTALL_MANIFEST" \
              "s3://${R2_BUCKET}/releases/install-manifest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=300"
            echo "R2: install-manifest ✓ (${TAG}/ + latest)"
          fi

          # 5. latest.json（现有逻辑）
          aws s3 cp "dist/latest.json" \
            "s3://${R2_BUCKET}/releases/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"
          echo "R2: latest.json ✓"

          echo "R2 上传完成"

      - name: Verify R2 release manifests
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF#refs/tags/v}"
          curl -fsSL "https://dakupdate.starfie1d.top/releases/latest.json?run=${GITHUB_RUN_ID}" -o latest.json
          curl -fsSL "https://dakupdate.starfie1d.top/releases/install-manifest.json?run=${GITHUB_RUN_ID}" -o install-manifest.json
          node - <<'NODE'
          const fs = require("fs");
          const latest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
          const install = JSON.parse(fs.readFileSync("install-manifest.json", "utf8"));
          const version = process.env.VERSION;
          if (latest.version !== version) throw new Error(`latest.json version ${latest.version} != ${version}`);
          if (install.appVersion !== version) throw new Error(`install appVersion ${install.appVersion} != ${version}`);
          for (const [label, asset] of Object.entries({ runtime: latest.assets.windows, installRuntime: install.runtime })) {
            if (!asset?.urls?.[0]?.startsWith("https://dakupdate.starfie1d.top/")) throw new Error(`${label} first URL is not R2`);
            if (!asset.sha256 || !asset.size) throw new Error(`${label} missing sha256/size`);
          }
          console.log("manifest metadata OK");
          NODE
          URL="$(node -p "require('./latest.json').assets.windows.urls[0]")"
          curl -fsSL "$URL" -o dak-runtime.zip
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const asset = require("./latest.json").assets.windows;
          const buf = fs.readFileSync("dak-runtime.zip");
          const sha = crypto.createHash("sha256").update(buf).digest("hex");
          if (buf.length !== asset.size) throw new Error(`runtime size ${buf.length} != ${asset.size}`);
          if (sha !== asset.sha256) throw new Error(`runtime sha256 ${sha} != ${asset.sha256}`);
          console.log("R2 runtime OK", buf.length);
          NODE

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/DAK-Studio-Setup*.exe
            dist/install-manifest.json
            dist/latest.json
          body: |
            **安装说明**

            ### 已安装用户（推荐：应用内更新）
            打开 DAK Studio，左下角点「检查更新」。应用会优先使用小体积前端增量包；
            如本次涉及运行时或依赖变更，会自动退回完整 runtime 更新。

            ### Windows（推荐：Web Installer）
            下载 `DAK-Studio-Setup-<version>.exe`，运行后选择安装目录，联网自动下载运行时 +
            内置赛事 + 地图数据。安装完成后首次启动即完整体验。

            ### Windows（离线：Full Portable Zip）
            下载 `dak-studio-windows-<version>-full.zip`，解压即用。
            已预装 Cologne Major 2026 完整赛事包 + 全部地图数据。

            ### Windows（开发者：Core Zip）
            下载 `dak-studio-windows-<version>.zip`，仅运行时，不含大赛事和地图数据。
            主要用于排查或手动覆盖安装；普通用户优先使用 Web Installer 或应用内更新。

            ### macOS
            1. 打开 DMG，把 **DAK Studio** 拖到右侧的 **Applications** 文件夹。
            2. 推出 DMG（桌面上右键 → 推出"DAK Studio"）。
            3. 从 **启动台** 或 `/Applications/DAK Studio.app` 打开。
            4. macOS 会提示「无法验证开发者」→ **系统设置 → 隐私与安全性 → 拉到底点「仍要打开」**。
               （不要直接从 DMG 挂载卷双击——Gatekeeper 会静默拒绝，没有任何提示。）

            终端一键解除隔离（替代步骤 4）：
            ```bash
            xattr -dr com.apple.quarantine "/Applications/DAK Studio.app"
            ```

            老版本 Win10 如启动后白屏，需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)。

            ---

            ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true

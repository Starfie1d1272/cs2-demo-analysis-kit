name: Backfill Uploader R2 v0.8.3

on:
  push:
    branches: ["fix/uploader-r2-distribution"]
    paths: [".github/workflows/backfill-uploader-r2.yml"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      VERSION: "0.8.3"
      TAG: "v0.8.3"
      R2_PUBLIC_BASE: "https://dakupdate.starfie1d.top"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Download immutable GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/Starfie1d1272/cs2-demo-analysis-kit/releases/download/${TAG}/rivalhub-demo-uploader-windows-${VERSION}.zip" \
            -o "rivalhub-demo-uploader-windows-${VERSION}.zip"
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/Starfie1d1272/cs2-demo-analysis-kit/releases/download/${TAG}/rivalhub-demo-uploader-${VERSION}.dmg" \
            -o "rivalhub-demo-uploader-${VERSION}.dmg"

      - name: Verify published v0.8.3 identity and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const version = process.env.VERSION;
          const tag = process.env.TAG;
          const base = process.env.R2_PUBLIC_BASE;
          const repo = "Starfie1d1272/cs2-demo-analysis-kit";
          const expected = {
            windows: { name: `rivalhub-demo-uploader-windows-${version}.zip`, size: 40003418, sha256: "29b4dbbcc3e17aabc46e22560c8e95380a4acab0fc291f57f123dfa1c2008c00" },
            macos: { name: `rivalhub-demo-uploader-${version}.dmg`, size: 37077723, sha256: "6abbc685930bac6a15cb73b96d92421d5d8330a585f9b99adc85a6f86a24bb72" },
          };
          const proxies = ["", "https://ghfast.top/", "https://gh-proxy.com/", "https://ghproxy.net/"];
          const assets = {};
          for (const [key, exp] of Object.entries(expected)) {
            const buf = fs.readFileSync(exp.name);
            const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
            if (buf.length !== exp.size || sha256 !== exp.sha256) throw new Error(`${key} does not match published v0.8.3 asset`);
            const raw = `https://github.com/${repo}/releases/download/${tag}/${exp.name}`;
            assets[key] = {
              name: exp.name,
              size: exp.size,
              sha256,
              urls: [`${base}/releases/${tag}/${exp.name}`, ...proxies.map((p) => p ? `${p}${raw}` : raw)],
            };
          }
          fs.writeFileSync("uploader-manifest.json", JSON.stringify({
            schemaVersion: "cs2-demo-analysis-kit/uploader-distribution-1",
            version,
            publishedAt: "2026-09-28T10:28:50Z",
            assets,
          }, null, 2) + "\n");
          NODE

      - name: Mirror exact assets to R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "rivalhub-demo-uploader-windows-${VERSION}.zip" \
            "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-windows-${VERSION}.zip" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/zip \
            --content-disposition "attachment; filename=rivalhub-demo-uploader-windows-${VERSION}.zip" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "rivalhub-demo-uploader-${VERSION}.dmg" \
            "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-${VERSION}.dmg" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/x-apple-diskimage \
            --content-disposition "attachment; filename=rivalhub-demo-uploader-${VERSION}.dmg" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp uploader-manifest.json \
            "s3://${R2_BUCKET}/releases/${TAG}/uploader-manifest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp uploader-manifest.json \
            "s3://${R2_BUCKET}/releases/uploader/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Verify R2 copies
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://${R2_BUCKET}/releases/uploader/latest.json" verify-manifest.json --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-windows-${VERSION}.zip" verify-windows.zip --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/releases/${TAG}/rivalhub-demo-uploader-${VERSION}.dmg" verify-macos.dmg --endpoint-url "$R2_ENDPOINT"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const m = JSON.parse(fs.readFileSync("verify-manifest.json", "utf8"));
          for (const [key, file] of [["windows", "verify-windows.zip"], ["macos", "verify-macos.dmg"]]) {
            const buf = fs.readFileSync(file);
            const sha = crypto.createHash("sha256").update(buf).digest("hex");
            if (buf.length !== m.assets[key].size || sha !== m.assets[key].sha256) throw new Error(`${key} R2 verification failed`);
          }
          console.log("v0.8.3 uploader R2 backfill verified");
          NODE

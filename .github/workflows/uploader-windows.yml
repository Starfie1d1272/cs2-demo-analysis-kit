name: Uploader Windows
on:
  pull_request:
    paths:
      - '.github/workflows/uploader-windows.yml'
      - 'python/**'
      - 'apps/rivalhub-uploader/**'
      - 'packages/rivalhub-upload/**'
      - 'scripts/*uploader*'
      - 'scripts/check-package-boundaries.mjs'
      - 'scripts/package-boundaries.test.mjs'
      - 'scripts/lib/package-files.mjs'
      - 'scripts/lib/package-imports.mjs'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      live_network_smoke:
        description: Verify public production HTTPS and reject an empty pairing poll (no writes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  uploader:
    name: Startup smoke and installer
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_MANAGED_PYTHON: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12.15'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check dependency boundaries on Windows
        run: pnpm check:package-boundaries
      - name: Legacy first-hop manifest and safe native capability
        run: node --test scripts/legacy-update-first-hop.test.mjs
      - name: Real pywebview reflection regression
        shell: bash
        run: |
          cd python
          uv sync --frozen --extra dev --extra gui --extra build
          uv run --frozen pytest
      - name: Verify uploader transport against the current RivalHub server
        if: github.event_name == 'workflow_dispatch' && inputs.live_network_smoke
        shell: bash
        run: |
          cd python
          uv run --frozen python ../scripts/smoke-uploader-network.py --output "$RUNNER_TEMP/uploader-startup-evidence/network.json"
      - name: Build complete uploader and installer
        shell: bash
        env:
          UV_FROZEN: 'true'
        run: bash scripts/package-uploader.sh
      - name: Frozen empty startup, message response, bridge ready, save dialog and cancel (twice)
        shell: powershell
        run: ./scripts/smoke-uploader-windows.ps1 -Exe "$pwd/python/dist/rivalhub-demo-uploader/rivalhub-demo-uploader.exe" -EvidenceDir "$env:RUNNER_TEMP/uploader-startup-evidence"
      - name: Build upgrade fixture and verify isolated installation
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $next = [version]$version
          $upgrade = "$($next.Major).$($next.Minor).$($next.Build + 1)"
          ./scripts/build-uploader-installer.ps1 -Version $upgrade -OutputDir "$env:RUNNER_TEMP/uploader-upgrade-fixture"
          ./scripts/test-uploader-installer.ps1 -Installer "$pwd/python/dist/RivalHub-Demo-Uploader-Setup-$version.exe" -UpgradeInstaller "$env:RUNNER_TEMP/uploader-upgrade-fixture/RivalHub-Demo-Uploader-Setup-$upgrade.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: uploader-windows-review
          compression-level: 0
          path: |
            python/dist/RivalHub-Demo-Uploader-Setup-*.exe
            python/dist/rivalhub-demo-uploader-windows-*.zip
            ${{ runner.temp }}/uploader-startup-evidence/**
            ${{ runner.temp }}/Uploader 安装 验证/*.log
            ${{ runner.temp }}/Uploader 安装 验证/startup/**
            ${{ runner.temp }}/Uploader 安装 验证/*.json
            ${{ runner.temp }}/Uploader 安装 验证/*.lnk

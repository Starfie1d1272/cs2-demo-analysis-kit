name: Uploader Windows startup
on:
  pull_request:
    paths:
      - '.github/workflows/uploader-startup-windows.yml'
      - 'python/**'
      - 'apps/rivalhub-uploader/**'
      - 'packages/rivalhub-upload/**'
      - 'scripts/package-uploader.sh'
      - 'scripts/smoke-uploader-windows.ps1'
      - 'scripts/smoke-uploader-network.py'
      - 'pnpm-lock.yaml'
      - 'scripts/check-package-boundaries.mjs'
      - 'scripts/package-boundaries.test.mjs'
      - 'scripts/lib/package-files.mjs'
      - 'scripts/lib/package-imports.mjs'
  workflow_dispatch:
    inputs:
      live_network_smoke:
        description: Verify public production HTTPS and reject an empty pairing poll (no writes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      UV_MANAGED_PYTHON: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12.15'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check dependency boundaries on Windows
        run: pnpm check:package-boundaries
      - name: Legacy first-hop manifest and safe native capability
        run: node --test scripts/legacy-update-first-hop.test.mjs
      - name: Real pywebview reflection regression
        shell: bash
        run: |
          cd python
          uv sync --frozen --extra dev --extra gui --extra build
          uv run --frozen pytest
      - name: Verify uploader transport against the current RivalHub server
        if: github.event_name == 'workflow_dispatch' && inputs.live_network_smoke
        shell: bash
        run: |
          cd python
          uv run --frozen python ../scripts/smoke-uploader-network.py --output "$RUNNER_TEMP/uploader-startup-evidence/network.json"
      - name: Package source into full Windows onedir ZIP
        shell: bash
        env:
          UV_FROZEN: 'true'
        run: bash scripts/package-uploader.sh
      - name: Frozen empty startup, message response, bridge ready, save dialog and cancel (twice)
        shell: powershell
        run: ./scripts/smoke-uploader-windows.ps1 -Exe "$pwd/python/dist/rivalhub-demo-uploader/rivalhub-demo-uploader.exe" -EvidenceDir "$env:RUNNER_TEMP/uploader-startup-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: uploader-startup-windows-review
          compression-level: 0
          path: |
            python/dist/rivalhub-demo-uploader-windows-*.zip
            ${{ runner.temp }}/uploader-startup-evidence/**

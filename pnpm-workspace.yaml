packages:
  - "packages/*"
  - "apps/*"
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@rivalhub/rival-rating'
  - '@rivalhub/rival-rating@0.1.0'
  - cs2-demo-format
  - '@rivalhub/rival-rating@0.2.0'
# Keep install freezing at the call site so dependency updaters can regenerate the lockfile.
# CI and documented day-to-day installs use --frozen-lockfile.
verifyDepsBeforeRun: error
